[build]
  command = "npm run build"
  publish = "dist"

# Same-origin proxies for the MiniMax API and its video CDN, so the browser
# can call them without CORS (mirrors the Vite dev proxy in vite.config.js).
[[redirects]]
  from = "/minimax-api/*"
  to = "https://api.minimax.io/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/minimax-cdn/*"
  to = "https://video-product.cdn.minimax.io/:splat"
  status = 200
  force = true
